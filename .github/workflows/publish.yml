name: publish
run-name: "publish ${{ inputs.version }} (${{ inputs.channel }})"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.1.75)"
        required: true
        type: string
      channel:
        description: "Release channel"
        required: true
        type: choice
        options:
          - next
          - latest
        default: next

concurrency: publish-${{ inputs.version }}

permissions:
  id-token: write
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: ubuntu-latest
            target: linux-x64-baseline
            baseline: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - run: bun install

      - name: Build
        working-directory: packages/opencode
        run: bun run ./script/build.ts --single ${{ matrix.baseline && '--baseline' || '' }}
        env:
          OPENCODE_CHANNEL: ${{ inputs.channel }}
          OPENCODE_VERSION: ${{ inputs.version }}

      - name: Smoke test - version
        working-directory: packages/opencode
        run: |
          BINARY=$(ls dist/*/bin/cerebras 2>/dev/null | grep -v musl | head -1 || ls dist/*/bin/opencode 2>/dev/null | grep -v musl | head -1)
          chmod +x "$BINARY"
          "$BINARY" --version

      - name: Smoke test - help
        working-directory: packages/opencode
        run: |
          BINARY=$(ls dist/*/bin/cerebras 2>/dev/null | grep -v musl | head -1 || ls dist/*/bin/opencode 2>/dev/null | grep -v musl | head -1)
          "$BINARY" --help

      - name: Smoke test - server starts and agents load
        if: ${{ !matrix.baseline }}
        working-directory: packages/opencode
        run: |
          BINARY=$(ls dist/*/bin/cerebras 2>/dev/null | grep -v musl | head -1 || ls dist/*/bin/opencode 2>/dev/null | grep -v musl | head -1)
          "$BINARY" serve --port 0 &
          PID=$!
          sleep 5
          if kill -0 $PID 2>/dev/null; then
            echo "Server ran for 5s without crashing"
            kill $PID 2>/dev/null || true
          else
            wait $PID 2>/dev/null || true
            echo "Server crashed"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: packages/opencode/dist/

  publish-binaries:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-arm64, darwin-x64, linux-x64, linux-arm64, linux-x64-baseline]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: dist/

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: npm install -g npm@latest

      - name: Prepare package
        run: |
          OS=$(echo "${{ matrix.target }}" | cut -d- -f1)
          ARCH=$(echo "${{ matrix.target }}" | cut -d- -f2)
          DIR=$(ls -d dist/*-${{ matrix.target }} 2>/dev/null | head -1)
          cat > "$DIR/package.json" << EOF
          {
            "name": "cerebras-cli-${{ matrix.target }}",
            "version": "${{ inputs.version }}",
            "os": ["$OS"],
            "cpu": ["$ARCH"],
            "repository": {
              "type": "git",
              "url": "https://github.com/kevint-cerebras/cerebras-code-cli"
            }
          }
          EOF
          chmod -R 755 "$DIR"

      - name: Publish
        run: |
          DIR=$(ls -d dist/*-${{ matrix.target }} 2>/dev/null | head -1)
          cd "$DIR" && npm publish --access public --tag ${{ inputs.channel }}

  publish-wrapper:
    needs: publish-binaries
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: npm install -g npm@latest

      - name: Create wrapper package
        run: |
          mkdir -p pkg/bin
          if [ -f packages/opencode/bin/cerebras ]; then
            cp packages/opencode/bin/cerebras pkg/bin/cerebras
          elif [ -f packages/opencode/bin/opencode ]; then
            cp packages/opencode/bin/opencode pkg/bin/cerebras
          fi
          [ -f packages/opencode/bin/opencode.cjs ] && cp packages/opencode/bin/opencode.cjs pkg/bin/opencode.cjs || true
          cp packages/opencode/script/postinstall.mjs pkg/postinstall.mjs
          sed -i 's|"opencode-|"cerebras-cli-|g' pkg/bin/cerebras
          sed -i 's|opencode-|cerebras-cli-|g' pkg/postinstall.mjs
          cat > pkg/package.json << EOF
          {
            "name": "cerebras-cli",
            "version": "${{ inputs.version }}",
            "description": "Cerebras AI coding agent for the terminal",
            "bin": {
              "cerebras-cli": "./bin/cerebras"
            },
            "scripts": {
              "postinstall": "bun ./postinstall.mjs || node ./postinstall.mjs"
            },
            "optionalDependencies": {
              "cerebras-cli-darwin-arm64": "${{ inputs.version }}",
              "cerebras-cli-darwin-x64": "${{ inputs.version }}",
              "cerebras-cli-linux-arm64": "${{ inputs.version }}",
              "cerebras-cli-linux-x64": "${{ inputs.version }}",
              "cerebras-cli-linux-x64-baseline": "${{ inputs.version }}"
            },
            "license": "MIT",
            "repository": {
              "type": "git",
              "url": "https://github.com/kevint-cerebras/cerebras-code-cli"
            }
          }
          EOF

      - name: Publish
        run: cd pkg && npm publish --access public --tag ${{ inputs.channel }}

      - name: Summary
        run: |
          echo "## Published cerebras-cli@${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Channel:** \`${{ inputs.channel }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.channel }}" = "next" ]; then
            echo "### Test it" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "npm install -g cerebras-cli@${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Promote to latest" >> $GITHUB_STEP_SUMMARY
            echo "Once verified, re-run this workflow with the same version and channel **latest**." >> $GITHUB_STEP_SUMMARY
          else
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "npm install -g cerebras-cli" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

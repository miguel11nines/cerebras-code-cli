name: Sync upstream

on:
  schedule:
    - cron: "0 8 * * *" # Daily at 8am UTC
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/sst/opencode.git || true
          git fetch upstream dev

      - name: Check for new commits
        id: check
        run: |
          BEHIND=$(git rev-list HEAD..upstream/dev --count)
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          echo "Commits behind upstream: $BEHIND"

      - name: Attempt merge
        if: steps.check.outputs.behind != '0'
        id: merge
        run: |
          BRANCH="auto/sync-upstream-$(date +%Y%m%d)"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          git checkout -b "$BRANCH"

          if git merge upstream/dev --no-edit; then
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
            git push origin "$BRANCH"
          else
            # Save conflict info for Claude
            git diff --name-only --diff-filter=U > /tmp/conflict-files.txt
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
            echo "Conflicts in: $(cat /tmp/conflict-files.txt)"
          fi

      - name: Handle conflicts
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.has_conflicts == 'true'
        run: |
          # Accept theirs to get a mergeable branch, Claude will fix in the PR
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              git checkout --theirs "$file" 2>/dev/null || true
              git add "$file"
            else
              git rm "$file" 2>/dev/null || true
            fi
          done < /tmp/conflict-files.txt
          git commit -m "merge upstream (conflicts auto-accepted - needs review)"

      - name: Push branch
        if: steps.check.outputs.behind != '0'
        run: |
          BRANCH="${{ steps.merge.outputs.branch }}"
          git push origin "$BRANCH"

      - name: Create PR
        if: steps.check.outputs.behind != '0'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.merge.outputs.branch }}"
          BEHIND="${{ steps.check.outputs.behind }}"
          HAD_CONFLICTS="${{ steps.merge.outputs.has_conflicts }}"

          BODY="Automated sync from [sst/opencode](https://github.com/sst/opencode) dev branch.

          **$BEHIND new commits** from upstream."

          if [ "$HAD_CONFLICTS" = "true" ]; then
            BODY="$BODY

          **Had merge conflicts** — accepted upstream versions. @claude please review the conflicting files and fix any of our customizations (cerebras branding, custom agents, install scripts, publish workflows) that were overwritten by upstream."
          fi

          PR_URL=$(gh pr create \
            --base dev \
            --head "$BRANCH" \
            --title "chore: sync upstream opencode ($BEHIND commits)" \
            --body "$BODY")
          echo "url=$PR_URL" >> $GITHUB_OUTPUT
